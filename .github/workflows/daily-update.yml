name: Daily Profile Update

on:
  schedule:
    # Her gün 09:00 UTC (12:00 TRT) çalışır
    - cron: '0 9 * * *'
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: furkankocaturk/furkankocaturk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update last active date
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          # README.md içinde "Last updated:" satırını güncelle veya ekle
          if grep -q "Last updated:" README.md; then
            sed -i "s/Last updated: .*/Last updated: $DATE/" README.md
          else
            # Profil başlığı altına ekle
            sed -i "/^# Furkan Koçtürk/a\\n> Last updated: $DATE" README.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: daily profile update $(date -u +'%Y-%m-%d')"
          git push
