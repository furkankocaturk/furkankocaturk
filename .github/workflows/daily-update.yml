name: Daily Profile Update

on:
  schedule:
    # Her gün 09:00, 13:00, 17:00, 21:00 UTC (4 kere)
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: furkankocaturk/furkankocaturk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate unique commit content
        id: content
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RANDOM_SUFFIX=$(openssl rand -hex 4)
          echo "timestamp=$DATE" >> $GITHUB_OUTPUT
          echo "random=$RANDOM_SUFFIX" >> $GITHUB_OUTPUT

      - name: Update README with activity marker
        run: |
          DATE="${{ steps.content.outputs.timestamp }}"
          RAND="${{ steps.content.outputs.random }}"
          
          # Aktivite bloğunu güncelle/ekle (README sonuna ekler)
          ACTIVITY_LINE="<!-- activity:$RAND --> Last active: $DATE"
          
          if grep -q "<!-- activity:" README.md; then
            sed -i "s/<!-- activity:.* --> Last active: .*/$ACTIVITY_LINE/" README.md
          else
            echo "" >> README.md
            echo "$ACTIVITY_LINE" >> README.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: activity update ${{ steps.content.outputs.timestamp }}"
          git push
